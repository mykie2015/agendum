name: Label Agendum actions

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply type and priority labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          body="$(gh issue view "$ISSUE_NUMBER" --repo "$GH_REPO" --json body --jq '.body' | tr -d '\r')"

          # Take only the first non-empty line under the heading, so other words in the body cannot match by accident
          field() {
            printf '%s\n' "$body" | awk -v h="### $1" '
              $0 == h { f = 1; next }
              f && /^### / { exit }
              f && NF { gsub(/^[ \t]+|[ \t]+$/, ""); print; exit }'
          }
          type="$(field "Event type" | tr '[:lower:]' '[:upper:]')"
          prio="$(field "Priority" | tr '[:lower:]' '[:upper:]')"

          all_types=(read research experiment build write post update domain buy watch)
          all_prios=(p0 p1 p2)
          add=()
          remove=()

          case "$type" in
            READ|RESEARCH|EXPERIMENT|BUILD|WRITE|POST|UPDATE|DOMAIN|BUY|WATCH)
              t="${type,,}"
              add+=("$t")
              for x in "${all_types[@]}"; do
                if [ "$x" != "$t" ]; then
                  remove+=("$x")
                fi
              done
              ;;
            *) echo "Unrecognized event type: '$type', skipping the type label" ;;
          esac

          # WATCH type or WATCH priority: add no p label, only ensure the watch label
          if [ "$type" = "WATCH" ] || [ "$prio" = "WATCH" ]; then
            [[ " ${add[*]-} " == *" watch "* ]] || add+=(watch)
            for x in "${all_prios[@]}"; do
              remove+=("$x")
            done
          else
            case "$prio" in
              P0|P1|P2)
                p="${prio,,}"
                add+=("$p")
                for x in "${all_prios[@]}"; do
                  if [ "$x" != "$p" ]; then
                    remove+=("$x")
                  fi
                done
                ;;
              *) echo "Unrecognized priority: '$prio', skipping the priority label" ;;
            esac
          fi

          # After an edit, fix stale labels. Remove only labels that are currently set and will not be added again,
          # so that type READ + priority WATCH does not remove the watch label just added back.
          current="$(gh issue view "$ISSUE_NUMBER" --repo "$GH_REPO" --json labels --jq '.labels[].name')"
          rm_now=()
          for x in "${remove[@]-}"; do
            [ -n "$x" ] || continue
            for a in "${add[@]-}"; do
              if [ "$x" = "$a" ]; then
                continue 2
              fi
            done
            if printf '%s\n' "$current" | grep -qx "$x"; then
              rm_now+=("$x")
            fi
          done

          args=()
          if [ "${#add[@]}" -gt 0 ]; then
            args+=(--add-label "$(IFS=,; echo "${add[*]}")")
          fi
          if [ "${#rm_now[@]}" -gt 0 ]; then
            args+=(--remove-label "$(IFS=,; echo "${rm_now[*]}")")
          fi
          if [ "${#args[@]}" -gt 0 ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GH_REPO" "${args[@]}"
          fi
