name: Agendum Action
description: Turn a verified, high-value signal into an action you can decide on in one minute, execute, and review.
title: "[TYPE] YYYY-MM-DD · one-line decision / action"
labels:
  - action
body:
  - type: markdown
    attributes:
      value: |
        **Decision first.** Order = decide → trust → understand → act → review.
        Do not open an issue for ordinary news, ordinary trending items, or duplicate signals. If a required field is missing, switch to WATCH or do not submit.

  # ---------- 1. Decide ----------
  - type: dropdown
    id: action-type
    attributes:
      label: Event type
      options: [READ, RESEARCH, EXPERIMENT, BUILD, WRITE, POST, UPDATE, DOMAIN, BUY, WATCH]
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: "P0 today / P1 this week / P2 backlog / WATCH no action yet (choose WATCH when the type is WATCH)."
      options: [P0, P1, P2, WATCH]
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Effort
      options:
        - XS · under 30 minutes
        - S · 1–2 hours
        - M · half a day to 1 day
        - L · more than 1 day
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: Core judgment
      description: "One \"so what\" sentence: is it worth it, what to do, why now. Not a news summary."
      placeholder: "Worth 2 hours to test X, because it directly answers my question Y in the harness research."
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why recommended
      description: "Reason + cost/benefit (time or money in, what comes back, cost of not doing it) + the concrete link to my projects or research."
      placeholder: |
        - Reason:
        - Cost: about X hours / $Y
        - Payoff:
        - Cost of skipping / timeliness:
        - Related project: vault-gardener / agent harness / ...
    validations:
      required: true

  # ---------- 2. Trust ----------
  - type: textarea
    id: evidence
    attributes:
      label: Evidence chain
      description: "Each item with a link and publish time (state the time zone). Claimed but unverified numbers must be marked \"unverified\"."
      value: |
        - **Primary source**:
        - **Published**:
        - **Independent verification**:
        - **Related discussion** (HN / X / GitHub):
        - **Limits / counter-evidence / unverified**:
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Discovery channel
      description: "For example HN / AIHot / X / Gmail·Newsletter / GitHub / Wisereads / a weekly newsletter (where it was found, not the primary source)."
    validations:
      required: true

  # ---------- 3. Understand ----------
  - type: textarea
    id: understanding
    attributes:
      label: Interpretation and breakdown
      description: "What happened, the background, why now; then the core mechanism, key numbers, and reusable points."
      value: |
        **Interpretation**:

        **Breakdown**:
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: "At most three sentences, so someone who skipped the sections above can retell it."
    validations:
      required: true

  # ---------- 4. Act ----------
  - type: textarea
    id: next-action
    attributes:
      label: Next step
      description: "Concrete and executable. No \"keep watching\" or \"research when free\"."
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Expected result and done standard
      description: "What you get when it is done; which condition allows closing."
      value: |
        - **Expected output**:
        - **Done standard**:
    validations:
      required: true

  # ---------- 5. Learn ----------
  - type: textarea
    id: progress
    attributes:
      label: Progress log
      description: "Current state is the last row (TODO / DOING / BLOCKED / DONE / WATCHING / DROPPED)."
      value: |
        | Date | Status | Progress |
        | --- | --- | --- |
        | YYYY-MM-DD | TODO | Issue created |
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Result / review
      description: "What was done, what came out, what was learned. Write failures too."
    validations:
      required: false

  - type: dropdown
    id: follow-up
    attributes:
      label: Follow-up decision
      options:
        - KEEP · continue
        - DOUBLE DOWN · invest more
        - FOLLOW-UP · create a follow-up Action
        - WATCH · move to watching
        - DROP · abandon
    validations:
      required: false
